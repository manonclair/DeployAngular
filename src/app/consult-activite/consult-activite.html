<h3>Détail de l'activité :</h3>

<ol>
  <li>
    Nom de l'activité :

@if (modification) {
  <input class="edit-input" type="text" [(ngModel)]="titreModifie" />
    } @else {
      <strong>{{ objectif }}</strong>
    }
  </li>
</ol>

<div class="actions">
  <button class="btn btn-supprimer" (click)="supprimeElem()">Supprimer</button>

  @if (modification) {
    <button class="btn btn-primaire" (click)="sauvegarder()">Sauvegarder</button>
  } @else {
    <button class="btn btn-primaire" (click)="modifier()">Modifier</button>
    <button class="btn btn-retour" (click)="retour()">Retour</button>
  }
</div>
